name: release

# Push a tag vX.Y.Z (tools/release.sh does it) → run the full test suite →
# publish a GitHub release with gsd-worktrees-X.Y.Z.tar.gz + SHA256SUMS.
# get.sh and gsd-update download exactly these two files.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches VERSION
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(head -1 VERSION | tr -d '[:space:]')" = "$v" ] \
            || { echo "tag $GITHUB_REF_NAME but VERSION says $(cat VERSION)"; exit 1; }
          echo "V=$v" >> "$GITHUB_ENV"
      - name: build
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="gsd-worktrees-$V/" \
            -o "dist/gsd-worktrees-$V.tar.gz" HEAD
          (cd dist && sha256sum "gsd-worktrees-$V.tar.gz" > SHA256SUMS && cat SHA256SUMS)
      - name: release notes (from CHANGELOG.md)
        run: |
          awk -v v="$V" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' \
            CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $V" > dist/notes.md
          cat dist/notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/gsd-worktrees-$V.tar.gz" dist/SHA256SUMS \
            --title "gsd-worktrees $V" --notes-file dist/notes.md
