name: release

# A push to main that changes VERSION → check it is a new version with release
# notes → run the full test suite → tag that commit and publish a GitHub release
# with gsd-worktrees-X.Y.Z.tar.gz + SHA256SUMS. install.sh and gsd-update download
# exactly these two files.
#
# A failed run tagged nothing. Fix it on main, then Actions → release → Run
# workflow (gh workflow run release.yml) releases main at the same VERSION.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          v=$(git ls-remote --tags origin | tools/release-check.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "new version: ${v:-none, VERSION already has its tag}"

  tests:
    needs: check
    if: needs.check.outputs.version != ''
    uses: ./.github/workflows/tests.yml

  release:
    needs: [check, tests]
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="gsd-worktrees-$V/" \
            -o "dist/gsd-worktrees-$V.tar.gz" HEAD
          (cd dist && sha256sum "gsd-worktrees-$V.tar.gz" > SHA256SUMS && cat SHA256SUMS)
      - name: release notes (from CHANGELOG.md)
        run: |
          awk -v v="$V" '$1 == "##" && ($2 == v || $2 == "[" v "]") {on=1; next} on && /^## / {exit} on {print}' \
            CHANGELOG.md > dist/notes.md
          cat dist/notes.md
      - name: tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" \
            "dist/gsd-worktrees-$V.tar.gz" dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "gsd-worktrees $V" --notes-file dist/notes.md
