name: tests

on:
  push:
    branches: ['**']     # tags run these through release.yml instead
  pull_request:
  workflow_call:         # release.yml gates a release on this suite

jobs:
  reconcile:
    # The reconciler is the one piece here that can silently destroy data, so it
    # is the piece that gets a gate. Both runners: the shims and hooks use
    # git plumbing whose behaviour differs between the BSD and GNU userlands.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: versions
        run: |
          bash --version | head -1
          git --version
          python3 --version
      - name: syntax
        run: |
          for f in bin/* lib/*.sh lib/trackers/*.sh install.sh get.sh shims/scripts/*.sh shims/scripts/hooks/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('lib/gsd_planning.py').read_text())"
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('lib/gsd_hook_payload.py').read_text())"
          node --check lib/ui-check.mjs
      - name: shellcheck
        # Ubuntu only: shellcheck is static analysis, so its verdict does not
        # differ per platform, and the macOS runner has no shellcheck (a brew
        # install on every run would buy nothing). The matrix is here for the
        # BSD-vs-GNU RUNTIME differences the suite exercises.
        if: matrix.os == 'ubuntu-latest'
        # Policy (intentional-pattern exclusions, with reasons): .shellcheckrc
        run: shellcheck -x bin/* lib/*.sh lib/trackers/*.sh get.sh tools/*.sh shims/scripts/*.sh shims/scripts/hooks/*.sh install.sh tests/*.sh
      - name: planning reconcile suite
        run: tests/test-planning-reconcile.sh
      - name: worktree guard suite
        run: tests/test-worktree-guard.sh
      - name: Gemini hook adapter suite
        run: bash tests/test-gemini-hook.sh
      - name: flow-next suite
        run: tests/test-flow-next.sh
      - name: provider adapter suite
        run: tests/test-providers.sh
      - name: standalone copy installation suite
        run: tests/test-install-copy.sh
      - name: fresh-review regression suite
        run: bash tests/test-review-fixes.sh
      - name: gsd-list suite
        run: tests/test-list.sh
      - name: full-review regression suite (2026-09-25)
        run: tests/test-review-round2.sh
      - name: command paths suite
        run: tests/test-commands.sh
      - name: ticket tracker suite
        run: tests/test-tracker.sh
      - name: release install + update suite
        run: tests/test-update.sh
      - name: UI gates suite
        run: tests/test-ui.sh
      - name: doctor checks suite
        run: tests/test-doctor.sh
      - name: a browser for the UI check suite
        # The runner behind `gsd-ui check` is only tested when it drives a real
        # browser: a pinned Playwright and its Chromium, outside the checkout.
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          printf '{"name":"pw","private":true}\n' > package.json
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: UI check suite (real browser)
        env:
          GSD_TEST_REQUIRE_BROWSER: 1   # a skip here would mean an untested checker
        run: GSD_PLAYWRIGHT_ROOT="$RUNNER_TEMP/pw" tests/test-ui-browser.sh
      - name: end-to-end suite (skips without gsd-sdk)
        run: tests/test-e2e.sh
