name: tests

on:
  push:
  pull_request:

jobs:
  reconcile:
    # The reconciler is the one piece here that can silently destroy data, so it
    # is the piece that gets a gate. Both runners: the shims and hooks use
    # git plumbing whose behaviour differs between the BSD and GNU userlands.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: versions
        run: |
          bash --version | head -1
          git --version
          python3 --version
      - name: syntax
        run: |
          for f in bin/* lib/common.sh shims/scripts/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('lib/gsd_planning.py').read_text())"
      - name: shellcheck
        # Ubuntu only: shellcheck is static analysis, so its verdict does not
        # differ per platform, and the macOS runner has no shellcheck (a brew
        # install on every run would buy nothing). The matrix is here for the
        # BSD-vs-GNU RUNTIME differences the suite exercises.
        if: matrix.os == 'ubuntu-latest'
        # Policy (intentional-pattern exclusions, with reasons): .shellcheckrc
        run: shellcheck -x bin/* lib/common.sh shims/scripts/*.sh shims/scripts/hooks/*.sh install.sh tests/*.sh
      - name: planning reconcile suite
        run: tests/test-planning-reconcile.sh
      - name: worktree guard suite
        run: tests/test-worktree-guard.sh
